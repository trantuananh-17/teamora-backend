# Quality gate for pull requests, and the same gate a release runs before it
# builds anything.
name: Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Called by release.yml so a tag cannot ship code that would not pass a PR.
  workflow_call:

# A new push to the same branch makes the in-flight run pointless — cancel it
# rather than pay for both.
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node before corepack: corepack ships with Node, so it does not exist on
      # PATH until this step has run.
      - uses: actions/setup-node@v4
        with:
          node-version: "22" # matches Dockerfile's `FROM node:22-alpine`

      # corepack activates the exact pnpm pinned by package.json#packageManager,
      # so CI cannot silently resolve a different one than developers use.
      - name: Enable corepack
        run: corepack enable

      # Ask pnpm where its store is rather than hardcoding a path — a wrong path
      # caches an empty directory, which always misses while looking like it works.
      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        # --frozen-lockfile: fail rather than silently resolve a newer version.
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # Unit tests only — nothing here opens the SQLite file. `src/config/env.ts`
      # validates at import and `db/client.ts` imports it, so a test that reaches
      # a repository passes locally with a .env present and fails here. Running
      # with DOTENV_CONFIG_PATH pointed at nothing is what makes that failure
      # reproducible on a developer's machine.
      - name: Test
        env:
          DOTENV_CONFIG_PATH: /nonexistent.env
        run: pnpm test

      - name: Build
        run: pnpm build

      # `src/db/schema` and `drizzle/` must not drift apart. Regenerating and
      # finding a diff means someone changed the schema without producing the
      # migration for it — which would pass every other check here and then fail
      # in production, where the tables do not match the code.
      #
      # drizzle-kit reads DATABASE_PATH from the config but `generate` never
      # opens it; the value only has to be present.
      - name: Migrations are in sync with the schema
        env:
          DATABASE_PATH: ./data/ci.db
        run: |
          pnpm db:generate
          if ! git diff --quiet --exit-code -- drizzle; then
            echo "::error::src/db/schema changed without a migration. Run 'pnpm db:generate' and commit ./drizzle."
            git --no-pager diff --stat -- drizzle
            exit 1
          fi

      # Every variable src/config/env.ts requires must be documented, or the
      # first person to provision an environment finds out which ones are
      # missing by watching the container refuse to boot.
      - name: .env.example covers every required variable
        run: |
          missing=0
          for key in $(grep -oE '^\s+[A-Z][A-Z0-9_]*:' src/config/env.ts | tr -d ' :'); do
            if ! grep -q "^${key}=" .env.example; then
              echo "::error::$key is required by src/config/env.ts but missing from .env.example"
              missing=1
            fi
          done
          exit $missing
